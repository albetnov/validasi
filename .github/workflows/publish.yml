name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
      - 'validasi_mcp-v*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve target package from tag
        id: package
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" =~ ^validasi_mcp-v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "directory=packages/validasi_mcp" >> "$GITHUB_OUTPUT"
            echo "prefix=validasi_mcp-v" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "directory=packages/validasi" >> "$GITHUB_OUTPUT"
            echo "prefix=v" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi

      - name: Verify tag version matches pubspec
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#${{ steps.package.outputs.prefix }}}"
          PUBSPEC_VERSION=$(grep '^version:' "${{ steps.package.outputs.directory }}/pubspec.yaml" | awk '{print $2}')
          if [[ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - name: Install root dependencies
        working-directory: ${{ steps.package.outputs.directory }}
        run: dart pub get

      - name: Publish package
        working-directory: ${{ steps.package.outputs.directory }}
        run: dart pub publish --force