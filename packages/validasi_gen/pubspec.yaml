version: 0.1.0-dev.1
repository: https://github.com/albetnov/validasi
homepage: https://albetnov.github.io/validasi

topics:
  - validation
  - codegen
  - annotations

environment:
  sdk: ^3.5.0
resolution: workspace

dependencies:
  build: ^4.0.0
  source_gen: ^4.0.0
  analyzer: ^12.0.0
  dart_style: ^3.1.8
  code_builder: ^4.11.1

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.5.15
  lints: ^6.0.0
  source_gen_test: ^1.3.6
  test: ^1.24.0
  validasi: ^1.0.0-dev.5
  validasi_annotation: ^0.2.0-dev.1
