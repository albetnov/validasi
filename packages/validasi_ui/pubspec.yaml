name: validasi_ui
description: Headless form management for Flutter, bridging Validasi schemas to UI.
version: 1.0.0-rc.2
repository: https://github.com/albetnov/validasi
homepage: https://albetnov.github.io/validasi

topics: 
  - validation
  - flutter
  - form-management

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  signals: ^7.1.0
  validasi: ^1.0.0-rc.6

dev_dependencies:
  build_runner: ">=2.4.12 <3.0.0"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0
  validasi_annotation: ^1.0.0-rc.1
  validasi_gen: ^1.0.0-rc.4
