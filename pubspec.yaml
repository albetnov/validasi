name: validasi_workspace
publish_to: none
description: Workspace configuration for validasi monorepo.
repository: https://github.com/albetnov/validasi

environment:
  sdk: ^3.5.0

workspace:
  - packages/validasi
  - packages/validasi_mcp
  - packages/validasi_gen
  - packages/validasi_annotation
  - packages/validasi_ui
  - packages/validasi_ui/example
  - packages/validasi_gen/example

dev_dependencies:
  melos: ^7.5.1
  yaml: ^3.1.3
  pub_semver: ^2.2.0
  http: ^1.6.0
  path: ^1.9.1

melos:
  repository: https://github.com/albetnov/validasi
  scripts:
    analyze:
      description: Analyze all workspace packages.
      run: dart run melos exec --fail-fast -- dart analyze --fatal-infos
    format:check:
      description: Verify formatting across all workspace packages.
      run: dart run melos exec --fail-fast -- dart format --output=none --set-exit-if-changed .
    format:fix:
      description: Format all workspace packages.
      run: dart run melos exec -- dart format .
    test:
      description: Run tests for all workspace packages.
      run: dart run melos exec --fail-fast --concurrency=1 --ignore=validasi_ui_example --ignore=validasi_ui -- dart test
    test:validasi:
      description: Run tests for the root validasi package.
      run: dart run melos exec --scope=validasi -- dart test
    test:gen:
      description: Run tests for the validasi_gen package.
      run: dart run melos exec --scope=validasi_gen -- dart test
    test:ui:
      description: Run tests for the validasi_ui package.
      run: dart run melos exec --scope=validasi_ui -- flutter test
    test:mcp:
      description: Run tests for the validasi_mcp package.
      run: dart run melos exec --scope=validasi_mcp -- dart test
    test:mcp:local:
      description: Run MCP tests against a local docs server.
      run: |
        cd packages/validasi_mcp && \
        LOCAL_DOCS=http://localhost:4173/validasi dart test
