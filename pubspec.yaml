name: validasi_workspace
publish_to: none
description: Workspace configuration for validasi monorepo.
repository: https://github.com/albetnov/validasi

environment:
  sdk: ^3.5.0

workspace:
  - packages/validasi
  - packages/validasi_mcp

dev_dependencies:
  melos: ^7.5.1

melos:
  repository: https://github.com/albetnov/validasi
  scripts:
    analyze:
      description: Analyze all workspace packages.
      run: dart run melos exec --fail-fast -- dart analyze --fatal-infos
    format:check:
      description: Verify formatting across all workspace packages.
      run: dart run melos exec --fail-fast -- dart format --output=none --set-exit-if-changed .
    format:fix:
      description: Format all workspace packages.
      run: dart run melos exec -- dart format .
    test:
      description: Run tests for all workspace packages.
      run: dart run melos exec --fail-fast --concurrency=1 -- dart test
    test:validasi:
      description: Run tests for the root validasi package.
      run: dart run melos exec --scope=validasi -- dart test
    test:mcp:
      description: Run tests for the validasi_mcp package.
      run: dart run melos exec --scope=validasi_mcp -- dart test
    test:mcp:update:
      description: Regenerate MCP snapshots and run tests.
      run: |
        cd packages/validasi_mcp && \
        UPDATE_SNAPSHOTS=true dart test test/mcp_e2e_test.dart && \
        dart test
